services:

  ordermanagement-api:
    container_name: ordermanagement-api

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Data Source=/app/data/orders.db"

    volumes:
      - ordermanagement-data:/app/data

    restart: unless-stopped


volumes:
  ordermanagement-data: